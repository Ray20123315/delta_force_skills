name: Verify assets and Forge build

on:
  push:
    branches:
      - fix/asset-ui-cleanup-20261117
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check generated icon sources
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const {ICONS, createPng} = require('./tools/generate_effect_icons.js');
          const dir = path.join('src','main','resources','assets','dealt_force_skills','textures','mob_effect');
          for (const name of ICONS) {
            const source = fs.readFileSync(path.join(dir, name + '.png'));
            assert.ok(source.equals(Buffer.from(createPng(name))), name + ' icon differs from generator');
          }
          const actual = fs.readdirSync(dir).filter(x => x.endsWith('.png'));
          assert.equal(actual.length, ICONS.length, 'Unexpected status-effect texture count');
          console.log('Validated', ICONS.length, 'original status-effect PNG files.');
          NODE
      - name: Build Forge mod
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build --stacktrace
